<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ramesh — Backend and Distributed Systems Engineering</title>
  <desc id="desc">A dark navy gradient banner with mint accents and a three-node distributed network illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1627"/>
      <stop offset=".54" stop-color="#102840"/>
      <stop offset="1" stop-color="#092A32"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#81E6C3"/>
      <stop offset="1" stop-color="#91BDFF"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7D0" stop-opacity=".23"/>
      <stop offset="1" stop-color="#79A9F4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A6D8F9" stroke-opacity=".058" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#background)"/>
