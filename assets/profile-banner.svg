  <text x="57" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A8C2D5" letter-spacing="1.3">PYTHON</text>
  <circle cx="158" cy="297" r="2.5" fill="#8BE7C5"/>
  <text x="176" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A8C2D5" letter-spacing="1.3">FASTAPI</text>
  <circle cx="288" cy="297" r="2.5" fill="#8BE7C5"/>
  <text x="306" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A8C2D5" letter-spacing="1.3">DOCKER</text>
  <circle cx="417" cy="297" r="2.5" fill="#8BE7C5"/>
  <text x="435" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A8C2D5" letter-spacing="1.3">BM25 SEARCH</text>
