  <circle cx="1020" cy="165" r="255" fill="url(#halo)"/>
  <rect x="56" y="49" width="190" height="29" rx="14.5" fill="#70E4C0" fill-opacity=".12" stroke="#70E4C0" stroke-opacity=".38"/>
